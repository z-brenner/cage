name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: lint + host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning cage install.sh guest/*.sh test/*.sh scripts/*.sh
      - name: install.ps1 parses and stays ASCII (Windows PowerShell 5.1 reads files in the system code page)
        run: |
          if grep -nP '[^\x00-\x7F]' install.ps1; then echo "non-ASCII in install.ps1"; exit 1; fi
          pwsh -NoProfile -Command '$t=$null; $e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e); if ($e) { $e | ForEach-Object { $_.ToString() }; exit 1 }'
      - name: Python helpers compile (OAuth on the host; speech-to-text and the privacy mask in the VM)
        run: python3 -m py_compile host/mcp_oauth.py host/ui/server.py guest/stt.py guest/mask.py
      - name: privacy mask
        run: test/mask.sh
      - name: web app (API, and the page in headless Chrome)
        run: |
          npm install --no-save --no-fund --no-audit --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 >/dev/null
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" CAGE_TEST_CHROME="$(command -v google-chrome)" test/ui.sh
      - name: Linux installer
        run: test/installer.sh
      - name: adapter rules (node): WhatsApp, and the app's chat relay
        run: node --test test/whatsapp.test.mjs test/app.test.mjs
      - name: host + setup tests (bash 5) + real cc-connect config validation
        run: |
          curl -fsSL https://github.com/chenhg5/cc-connect/releases/download/v1.5.0/cc-connect-v1.5.0-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          CAGE_TEST_CC_CONNECT="$RUNNER_TEMP/cc-connect-v1.5.0-linux-amd64" test/host.sh
          test/setup.sh
      - name: browser sign-in (OAuth) against a mock MCP server
        run: test/oauth.sh
      - name: host + setup tests (bash 3.2, as shipped on macOS)
        run: >
          docker run --rm -v "$PWD:/w:ro" -w /w bash:3.2
          sh -c 'apk add -q python3 curl tar openssl >/dev/null && bash test/host.sh && bash test/setup.sh'

  windows-installer:
    name: windows installer (check only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1, as a file
        shell: powershell
        run: |
          $env:CAGE_CHECK_ONLY = '1'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 *>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'check only: would set up WSL 2|virtualization is turned off|needs Windows 11') { throw 'unexpected installer output' }
      - name: PowerShell 7, the way `irm | iex` runs it (must not close the session)
        shell: pwsh
        run: |
          $env:CAGE_CHECK_ONLY = '1'
          Invoke-Expression (Get-Content -Raw .\install.ps1)
          'still here' | Out-File still-here.txt
      - name: the session survived
        shell: pwsh
        run: if (-not (Test-Path still-here.txt)) { throw 'install.ps1 ended the PowerShell session' }

  guest-smoke:
    name: guest smoke (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, antigravity]
    steps:
      - uses: actions/checkout@v4
      - run: test/guest-smoke.sh ${{ matrix.agent }}
      - name: waking up with no network at all (from the agent's cache)
        run: test/offline-wake.sh ${{ matrix.agent }}

  microvm:
    name: microVM e2e (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, antigravity]
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: install microsandbox (pinned; avoids the installer's anonymous GitHub API lookup)
        env:
          MSB_VERSION: v0.7.5
        run: |
          test/install-msb-pinned.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: test/microvm-e2e.sh ${{ matrix.agent }}
