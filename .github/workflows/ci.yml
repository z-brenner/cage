name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 5 * * *'   # every night too: the vendors' CLIs and installers change without a push here

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces. On main, a run that has started always finishes (a
# release needs CI's verdict on its own commit, see release.yml); a newer push only replaces one still waiting to start.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: lint + host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint, for test/all.sh to check the workflow files (a pinned release, its checksum checked)
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install.ps1 parses and stays ASCII (Windows PowerShell 5.1 reads files in the system code page)
        run: |
          if grep -nP '[^\x00-\x7F]' install.ps1; then echo "non-ASCII in install.ps1"; exit 1; fi
          pwsh -NoProfile -Command '$t=$null; $e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e); if ($e) { $e | ForEach-Object { $_.ToString() }; exit 1 }'
      # test/mask.sh ends with the detection gates (test/mask_corpus.py); test/mask-vm.sh runs the mask's VM side
      # (memory.sh, cage mask forget, cage ask) in a container
      - name: privacy mask (also on Python 3.9, which `cage mask try` may use on a Mac, and in a stand-in VM)
        run: |
          test/mask.sh
          docker run --rm -v "$PWD:/w:ro" -w /w python:3.9-slim bash test/mask.sh
          test/mask-vm.sh
      - name: "unit tests: node's (the WhatsApp adapter, the app's chat relay) and Python's (speech-to-text in the VM, the web app's server)"
        run: test/all.sh unit
      - name: a real cc-connect, to check the configs cage writes
        run: |
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/cc-connect.tgz" \
            https://github.com/chenhg5/cc-connect/releases/download/v1.5.1-beta.3/cc-connect-v1.5.1-beta.3-linux-amd64.tar.gz
          echo "4c969474d9e971395f36842646ef42a519557e90e0fee4eba128a4ba786ac21a  $RUNNER_TEMP/cc-connect.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cc-connect.tgz" -C "$RUNNER_TEMP"
      # CAGE_TEST_NO_SKIP: a suite that can't run here (no actionlint, say) fails the job instead of being skipped
      - name: the other fast checks, as a local test/all.sh runs them (mask and unit are the two steps above; ui is its own job)
        env:
          CAGE_TEST_NO_SKIP: 1
          CAGE_TEST_CC_CONNECT: ${{ runner.temp }}/cc-connect-v1.5.1-beta.3-linux-amd64
        run: test/all.sh --skip mask unit ui
      # util-linux's script gives the tests a terminal, for the colour and mascot test (busybox has no script)
      - name: host, setup, sign-in and privacy mask tests (bash 3.2, as shipped on macOS)
        run: >
          docker run --rm -v "$PWD:/w:ro" -w /w bash:3.2
          sh -c 'apk add -q python3 curl tar openssl util-linux-misc >/dev/null
          && bash test/host.sh && bash test/setup.sh && bash test/oauth.sh && bash test/mask.sh'

  # The web app in a real browser: the longest of the fast suites (about 3 minutes), in a job of its own, so a slow run
  # of it can't time out the checks above
  ui:
    name: web app (in Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Playwright
        run: npm install --no-save --no-fund --no-audit --prefix "$RUNNER_TEMP/pw" playwright@1.56.1 >/dev/null
      - name: the web app's suite, as test/all.sh runs it
        env:
          CAGE_TEST_NO_SKIP: 1
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
        run: CAGE_TEST_CHROME="$(command -v google-chrome)" test/all.sh ui

  windows-installer:
    name: windows installer (check only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1, as a file
        shell: powershell
        run: |
          $env:CAGE_CHECK_ONLY = '1'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 *>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'check only: would set up WSL 2|virtualization is turned off|needs Windows 11|GB free on|turned off part of WSL') { throw 'unexpected installer output' }
      - name: the uninstall mode (check only)
        shell: powershell
        run: |
          $env:CAGE_CHECK_ONLY = '1'
          $env:CAGE_UNINSTALL = '1'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 *>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'check only: would ask, offer a backup, then remove all of that') { throw 'unexpected uninstall output' }
      - name: PowerShell 7, the way `irm | iex` runs it (must not close the session)
        shell: pwsh
        run: |
          $env:CAGE_CHECK_ONLY = '1'
          Invoke-Expression (Get-Content -Raw .\install.ps1)
          'still here' | Out-File still-here.txt
      - name: the session survived
        shell: pwsh
        run: if (-not (Test-Path still-here.txt)) { throw 'install.ps1 ended the PowerShell session' }

  guest-smoke:
    name: guest smoke (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, antigravity]
    env:
      # Ubuntu's packages from the mirror next to GitHub's runners; the scheduled run uses Ubuntu's own servers, as
      # people's agents do
      CAGE_TEST_DOCKER_ARGS: ${{ github.event_name != 'schedule' && '-e CAGE_APT_MIRROR=http://azure.archive.ubuntu.com/ubuntu/' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: guest smoke
        run: CAGE_TEST_ARTIFACTS="$RUNNER_TEMP/artifacts" test/guest-smoke.sh ${{ matrix.agent }}
      - name: waking up with no network at all (from the agent's cache)
        if: success() || failure()
        timeout-minutes: 20
        run: CAGE_TEST_ARTIFACTS="$RUNNER_TEMP/artifacts" test/offline-wake.sh ${{ matrix.agent }}
      - name: what the guest was doing
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-${{ matrix.agent }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  microvm:
    name: microVM e2e (${{ matrix.agent }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, cursor, antigravity]
    env:
      # as for guest-smoke; cage up passes it to the VMs
      CAGE_APT_MIRROR: ${{ github.event_name != 'schedule' && 'http://azure.archive.ubuntu.com/ubuntu/' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: install microsandbox (the version cage pins; avoids the installer's anonymous GitHub API lookup)
        run: |
          MSB_VERSION="$(grep -oP '^CAGE_MSB_VERSION=\K\S+' cage)" test/install-msb-pinned.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: CAGE_TEST_ARTIFACTS="$RUNNER_TEMP/artifacts" test/microvm-e2e.sh ${{ matrix.agent }}
      - name: what the VM was doing
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microvm-${{ matrix.agent }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore
